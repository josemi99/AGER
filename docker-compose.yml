services:
  db:
    image: mysql:8.0
    container_name: ager_db
    restart: always
    environment:
      MYSQL_DATABASE: AGER_TRENES
      MYSQL_USER: josemi
      MYSQL_PASSWORD: josemi
      MYSQL_ROOT_PASSWORD: josemivi
    volumes:
      - ./db-init/init.sql:/docker-entrypoint-initdb.d/init.sql

  php:
    build:
      context: .
      dockerfile: ./docker/php.Dockerfile
    container_name: ager_php
    environment:
      DB_HOST: db
      DB_NAME: AGER_TRENES
      DB_USER: josemi
      DB_PASS: josemi
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: ager_web
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ager_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: josemivi
    depends_on:
      - db
